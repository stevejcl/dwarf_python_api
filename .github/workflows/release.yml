name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version from setup.py
        id: version
        run: |
          VERSION=$(python setup.py --version)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine package version"
            exit 1
          fi

          echo "Package version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
    
      - name: Validate tag against package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXPECTED="v${{ steps.version.outputs.version }}"
          ACTUAL="${{ github.ref_name }}"

          echo "Package version: $EXPECTED"
          echo "Git tag:         $ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: Git tag does not match setup.py version."
            exit 1
          fi

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          echo "Creating tag: $TAG"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Clean dist
        run: rm -rf dist

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify generated packages
        run: |
          echo "Expected version: ${{ steps.version.outputs.version }}"
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      - name: Create GitHub Release from pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
